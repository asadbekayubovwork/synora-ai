upstream synora_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    server_name synora-ai.uz;

    access_log /var/log/nginx/synora-ai.uz.access.log;
    error_log  /var/log/nginx/synora-ai.uz.error.log;

    charset utf-8;
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 300s;

    # Hashed Nuxt bundles — filename changes on every build, so cache forever.
    location /_nuxt/ {
        proxy_pass http://synora_app;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|avif|svg|woff2?|ttf|eot|mp4|webm)$ {
        proxy_pass http://synora_app;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://synora_app;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/synora-ai.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/synora-ai.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


# www used to serve the app itself, on the same block as the apex. It redirects
# instead because a few things are scoped to one exact origin and quietly break
# on the other:
#
#   * The Telegram Login Widget matches the *exact* host it was registered with
#     — no subdomains — and BotFather holds one domain per bot. With www serving
#     the app, a visitor who arrived there got "Bot domain invalid" where the
#     sign-in button should be.
#   * OAUTH_REDIRECT_URIS, the provider consoles and the API's CORS_ORIGINS all
#     have to name every origin the app answers on. One host is one entry.
#
# The certificate already covers www (see synora-certbot-bootstrap.sh), so this
# block only needs the TLS lines to complete a handshake before answering 301.
server {
    server_name www.synora-ai.uz;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/synora-ai.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/synora-ai.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://synora-ai.uz$request_uri;
}


server {
    # Straight to the canonical host. Redirecting to https://www first would
    # only bounce again off the block above, for two round-trips instead of one.
    if ($host = www.synora-ai.uz) {
        return 301 https://synora-ai.uz$request_uri;
    } # managed by Certbot


    if ($host = synora-ai.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name synora-ai.uz www.synora-ai.uz;
    return 404; # managed by Certbot




}